# Configuração comum do Airflow
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-meta/airflow
    AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd7cA="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__SECRET_KEY: "lab-secret-key-2024"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres-meta:
      condition: service_healthy
  networks:
    - airflow-net

services:
  # Banco de metadados do Airflow
  postgres-meta:
    image: postgres:16
    container_name: airflow-meta-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - airflow-net

  # Banco de destino do pipeline
  postgres-lab:
    image: postgres:16
    container_name: airflow-lab-db
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab123
      POSTGRES_DB: labdb
    volumes:
      - postgres-lab-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lab"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - airflow-net

  # Inicialização
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname Lab \
          --role Admin \
          --email admin@lab.local \
          --password admin
        airflow connections add postgres_lab \
          --conn-type postgres \
          --conn-host postgres-lab \
          --conn-login lab \
          --conn-password lab123 \
          --conn-schema labdb \
          --conn-port 5432
        airflow pools set ecommerce_pool 2 "Limita a concorrência das tasks mapeadas por categoria"
        mkdir -p /opt/airflow/logs && chown -R 50000:0 /opt/airflow/logs
        echo "=== Airflow inicializado. Acesse http://localhost:8080 ==="
    depends_on:
      postgres-meta:
        condition: service_healthy
      postgres-lab:
        condition: service_healthy

  # Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--allow-multiple", "--limit", "100"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Webserver
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-meta-data:
  postgres-lab-data:

networks:
  airflow-net:
    driver: bridge
